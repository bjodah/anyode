when:
  - event: [push]

steps:
  - name: run-tests-without-lapack
    image: cont-reg.bjodah.se:443/bjodah/triceratops-3:65
    environment:
      ANYODE_NO_LAPACK: 1
    commands:
      - bash -l ./scripts/ci.sh

  - name: run-tests-with-lapack
    image: cont-reg.bjodah.se:443/bjodah/triceratops-3:65
    environment:
      ANYODE_NO_LAPACK: 0
    commands:
      - bash -l ./scripts/ci.sh
